<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Prompter">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Телепромптер</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --accent: #e8ff00;
    --text: #f0f0f0;
    --muted: #444;
    --green: #00ff88;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #000; color: var(--text); font-family: 'IBM Plex Sans', sans-serif; height: 100dvh; overflow: hidden; }

  .screen { display: none; width: 100%; height: 100dvh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ══ ROLE SELECT ══ */
  #screen-role {
    background: var(--bg); align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  #screen-role::before {
    content: 'PROMPTER'; position: absolute;
    font-family: 'Bebas Neue', sans-serif; font-size: 38vw;
    color: #111; letter-spacing: -2vw; line-height: 1;
    user-select: none; pointer-events: none;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .role-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 40px 24px; }
  .role-title { font-family: 'Bebas Neue', sans-serif; font-size: 52px; letter-spacing: 4px; color: var(--accent); text-align: center; line-height: 1; }
  .role-subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; text-align: center; }
  .role-buttons { display: flex; flex-direction: column; gap: 12px; width: 260px; }
  .btn-role {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    padding: 18px 24px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 16px;
  }
  .btn-role:active { opacity: 0.7; }
  .btn-role.controller { border-color: var(--accent); }
  .btn-role-icon { font-size: 22px; }
  .btn-role-text { display: flex; flex-direction: column; gap: 3px; }
  .btn-role-label { font-size: 13px; letter-spacing: 2px; }
  .btn-role-desc { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: none; font-family: 'IBM Plex Sans', sans-serif; }

  /* ══ CONTROLLER ══ */
  #screen-controller { background: var(--bg); }

  /* Mirror — top portion */
  .ctrl-mirror {
    flex: 0 0 42%;
    position: relative;
    background: #000;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  /* Scale-down the text to fit the mirror */
  .ctrl-mirror-inner {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .ctrl-mirror-text-wrap {
    position: absolute;
    transform-origin: top left;
    padding: 0 32px;
    padding-bottom: 844px;
    will-change: transform;
  }
  .ctrl-mirror-text {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 300;
    line-height: 1.35;
    color: #fff;
    white-space: pre-wrap;
    word-break: break-word;
    width: 400px; margin: 0 auto;
    text-align: center;
  }
  /* Dim overlay when paused */
  .ctrl-mirror-dim {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.45);
    opacity: 0; transition: opacity 0.2s;
    pointer-events: none; z-index: 3;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-mirror-dim.paused { opacity: 1; }
  .ctrl-mirror-dim-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 4px; color: var(--accent);
  }
  /* No text state */
  .ctrl-mirror-empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
    pointer-events: none;
  }
  /* Progress bar at top of mirror */
  .ctrl-mirror-progress {
    position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 5;
    background: transparent;
  }
  .ctrl-mirror-progress-fill {
    height: 100%; width: 0%; background: var(--accent);
    transition: width 0.2s linear;
  }

  /* Panel — bottom portion */
  .ctrl-panel {
    flex: 1;
    display: flex; flex-direction: column;
    padding: 0;
    overflow: hidden;
  }

  /* Play button — big, full width */
  .ctrl-play-btn {
    width: 100%; flex: 0 0 72px;
    background: transparent; border: none; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    cursor: pointer; -webkit-appearance: none;
    transition: background 0.1s;
  }
  .ctrl-play-btn:active { background: rgba(232,255,0,0.08); }
  .ctrl-play-btn.playing { background: rgba(232,255,0,0.05); }
  .ctrl-play-icon { font-size: 28px; }
  .ctrl-play-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 4px; color: var(--accent);
  }

  /* Sliders area */
  .ctrl-sliders {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; gap: 0;
    border-bottom: 1px solid var(--border);
  }
  .ctrl-slider-row {
    flex: 1; display: flex; align-items: center; gap: 14px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
  }
  .ctrl-slider-row:last-child { border-bottom: none; }
  .ctrl-slider-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
    min-width: 54px;
  }
  .ctrl-slider-val {
    font-family: 'Bebas Neue', sans-serif; font-size: 26px;
    min-width: 44px; text-align: right;
  }
  .ctrl-slider-val.accent { color: var(--accent); }
  .ctrl-slider-val.white { color: var(--text); }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: var(--border); outline: none; border-radius: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    background: var(--accent); border-radius: 0; cursor: pointer;
  }

  /* Bottom action row */
  .ctrl-actions {
    flex: 0 0 52px; display: flex;
  }
  .ctrl-action-btn {
    flex: 1; background: transparent; border: none;
    border-right: 1px solid var(--border);
    color: var(--muted); font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-appearance: none;
  }
  .ctrl-action-btn:last-child { border-right: none; }
  .ctrl-action-btn:active { background: rgba(255,255,255,0.05); color: var(--text); }

  /* Conn status row */
  .ctrl-conn-row {
    flex: 0 0 28px; display: flex; align-items: center;
    padding: 0 16px; gap: 8px; border-top: 1px solid var(--border);
  }
  .conn-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted); transition: background 0.3s;
    flex-shrink: 0;
  }
  .conn-dot.online { background: var(--green); box-shadow: 0 0 5px var(--green); }
  .conn-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
  }

  /* ══ DISPLAY ══ */
  #screen-display { background: #000; }
  .disp-wrap {
    position: absolute; width: 100%;
    padding: 0 32px 100vh 32px;
    will-change: transform;
  }
  .disp-text {
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 300;
    font-size: 52px; line-height: 1.35; color: #fff;
    white-space: pre-wrap; word-break: break-word;
    width: 400px; margin: 0 auto;
    text-align: center;
  }
  .disp-waiting {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing: 3px; color: #2a2a2a; text-transform: uppercase;
    pointer-events: none;
  }
  .disp-rotate-overlay {
    position: absolute; inset: 0; z-index: 50;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
  }
  .disp-rotate-overlay.hidden { display: none; }
  .disp-rotate-icon { font-size: 48px; }
  .disp-rotate-text {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 3px; color: var(--muted); text-transform: uppercase;
    text-align: center;
  }

  /* ══ EDIT MODAL ══ */
  #editModal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: var(--bg); flex-direction: column;
  }
  #editModal.active { display: flex; }
  .edit-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .edit-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: var(--accent); }
  .edit-close {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; padding: 8px 14px; cursor: pointer;
  }
  .edit-close:active { border-color: var(--accent); color: var(--accent); }
  #scriptInput {
    flex: 1; background: var(--surface); border: none; color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; line-height: 1.7;
    padding: 16px 20px; resize: none; outline: none; -webkit-appearance: none; min-height: 0;
  }
  #scriptInput::placeholder { color: var(--muted); }
  .edit-footer {
    padding: 12px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; flex-shrink: 0;
  }
  .edit-btn {
    flex: 1; background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; padding: 12px; cursor: pointer;
  }
  .edit-btn.primary { border-color: var(--accent); color: var(--accent); background: rgba(232,255,0,0.05); }
  .edit-btn:active { opacity: 0.7; }

  /* ══ SELFIE ══ */
  #screen-selfie { position: relative; overflow: hidden; background: #000; touch-action: none; }
  .sf-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); /* preview mirrored like the iPhone camera; recording is not */
  }
  .sf-band {
    position: absolute; left: 0; right: 0; top: env(safe-area-inset-top, 0px);
    height: 30%; z-index: 2;
    display: flex; justify-content: center;
  }
  .sf-box { position: relative; height: 100%; overflow: hidden; border-radius: 0 0 10px 10px; flex-shrink: 0; }
  .sf-text-wrap { padding: 6px 12px 0; will-change: transform; }
  .sf-text {
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; line-height: 1.3;
    white-space: pre-wrap; word-break: break-word; text-align: center;
  }
  .sf-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px;
    color: rgba(255,255,255,0.6); text-transform: uppercase; pointer-events: none;
  }
  .sf-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; }
  .sf-progress div { height: 100%; width: 0; background: var(--accent); }
  .sf-cam-msg {
    position: absolute; inset: 0; z-index: 1; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 32px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px;
    color: var(--muted); text-align: center;
  }
  .sf-cam-msg.show { display: flex; }

  .sf-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; align-items: center; justify-items: center;
    background: linear-gradient(transparent, rgba(0,0,0,0.55));
  }
  .sf-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.18);
    color: #fff; font-size: 20px; cursor: pointer; -webkit-appearance: none;
    display: flex; align-items: center; justify-content: center;
  }
  .sf-btn:active, .sf-btn.on { background: rgba(232,255,0,0.25); border-color: var(--accent); }
  .sf-rec {
    width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff;
    background: transparent; cursor: pointer; -webkit-appearance: none;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .sf-rec span {
    width: 56px; height: 56px; border-radius: 50%; background: #ff3b30;
    transition: all 0.2s;
  }
  .sf-rec.recording span { width: 28px; height: 28px; border-radius: 6px; }
  .sf-timer {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #fff;
    background: rgba(255,59,48,0.85); padding: 3px 8px; border-radius: 4px;
  }
  .sf-timer:empty { display: none; }

  .sf-settings {
    position: absolute; left: 0; right: 0; z-index: 3; display: none;
    bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    max-height: 52%; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    background: rgba(10,10,10,0.82); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
  }
  .sf-settings.open { display: block; }
  .sf-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 18px; border-bottom: 1px solid var(--border);
  }
  .sf-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px;
    color: #888; text-transform: uppercase; min-width: 62px;
  }
  .sf-val { font-family: 'Bebas Neue', sans-serif; font-size: 22px; min-width: 44px; text-align: right; color: var(--text); }
  .sf-swatches { flex: 1; display: flex; gap: 10px; align-items: center; }
  .sf-swatch {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid #333; cursor: pointer;
    -webkit-appearance: none; padding: 0;
  }
  .sf-swatch.on { border-color: #fff; box-shadow: 0 0 0 2px #000 inset; }
  .sf-color-input { width: 32px; height: 32px; border: none; background: none; padding: 0; }
  .sf-toggle {
    flex: 1; background: transparent; border: 1px solid var(--border); color: #888;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    padding: 9px 4px; cursor: pointer; -webkit-appearance: none;
  }
  .sf-toggle.on { border-color: var(--accent); color: var(--accent); background: rgba(232,255,0,0.08); }
  .sf-actions { display: flex; }
  .sf-actions button {
    flex: 1; background: transparent; border: none; border-right: 1px solid var(--border);
    color: #aaa; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; padding: 16px 4px; cursor: pointer; -webkit-appearance: none;
  }
  .sf-actions button:last-child { border-right: none; }
  .sf-actions button:active { color: var(--text); background: rgba(255,255,255,0.05); }
  .sf-info { padding: 10px 18px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 1px; color: #555; }

  .sf-save {
    position: absolute; inset: 0; z-index: 10; display: none;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 24px;
  }
  .sf-save.open { display: flex; }
  .sf-save-box {
    width: 100%; max-width: 320px; background: var(--bg); border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 12px; padding: 20px;
  }
  .sf-save-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--accent); }
  .sf-save-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #888; }
</style>
</head>
<body>

<!-- ROLE SELECT -->
<div id="screen-role" class="screen active">
  <div class="role-inner">
    <div>
      <div class="role-title">Prompter</div>
      <div class="role-subtitle">Выберите роль устройства</div>
    </div>
    <div class="role-buttons">
      <button class="btn-role controller" onclick="joinAs('controller')">
        <span class="btn-role-icon">🎛</span>
        <span class="btn-role-text">
          <span class="btn-role-label">Контроллер</span>
          <span class="btn-role-desc">Миниатюра + управление</span>
        </span>
      </button>
      <button class="btn-role" onclick="joinAs('display')">
        <span class="btn-role-icon">📺</span>
        <span class="btn-role-text">
          <span class="btn-role-label">Дисплей</span>
          <span class="btn-role-desc">Только отображение текста</span>
        </span>
      </button>
      <button class="btn-role" onclick="startSelfie()">
        <span class="btn-role-icon">🤳</span>
        <span class="btn-role-text">
          <span class="btn-role-label">Селфи</span>
          <span class="btn-role-desc">Камера + текст, запись видео</span>
        </span>
      </button>
    </div>
  </div>
</div>

<!-- CONTROLLER -->
<div id="screen-controller" class="screen">
  <!-- Mirror top -->
  <div class="ctrl-mirror" id="ctrlMirror">
    <div class="ctrl-mirror-progress"><div class="ctrl-mirror-progress-fill" id="ctrlProgress"></div></div>
    <div class="ctrl-mirror-inner">
      <div class="ctrl-mirror-text-wrap" id="ctrlTextWrap">
        <div class="ctrl-mirror-text" id="ctrlText"></div>
      </div>
    </div>
    <div class="ctrl-mirror-dim paused" id="ctrlDim"></div>
    <div class="ctrl-mirror-empty" id="ctrlEmpty">Нет текста — нажмите «Текст»</div>
  </div>

  <!-- Controls bottom -->
  <div class="ctrl-panel">
    <!-- Play/Pause -->
    <button class="ctrl-play-btn" id="playBtn" onclick="togglePlay()">
      <span class="ctrl-play-icon" id="playIcon">▶</span>
      <span class="ctrl-play-label" id="playLabel">СТАРТ</span>
    </button>

    <!-- Sliders -->
    <div class="ctrl-sliders">
      <div class="ctrl-slider-row">
        <span class="ctrl-slider-label">Скорость</span>
        <input type="range" id="speedSlider" min="10" max="300" value="50" oninput="onSpeed(this.value)">
        <span class="ctrl-slider-val accent" id="speedVal">50</span>
      </div>
      <div class="ctrl-slider-row">
        <span class="ctrl-slider-label">Размер</span>
        <input type="range" id="fontSlider" min="24" max="120" value="52" oninput="onFontSize(this.value)">
        <span class="ctrl-slider-val white" id="fontVal">52</span>
      </div>
      <div class="ctrl-slider-row">
        <span class="ctrl-slider-label">Ширина</span>
        <input type="range" id="textWidthSlider" min="200" max="600" value="400" oninput="onTextWidth(this.value)">
        <span class="ctrl-slider-val white" id="textWidthVal">400</span>
      </div>
      <div class="ctrl-slider-row">
        <span class="ctrl-slider-label">Интерв</span>
        <input type="range" id="lineHeightSlider" min="100" max="250" value="135" oninput="onLineHeight(this.value)">
        <span class="ctrl-slider-val white" id="lineHeightVal">1.35</span>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="ctrl-actions">
      <button class="ctrl-action-btn" onclick="openEdit()">✏️ Текст</button>
      <button class="ctrl-action-btn" onclick="replayFromStart()">🔄</button>
      <button class="ctrl-action-btn" onclick="document.getElementById('fileInput').click()">📁 Файл</button>
    </div>

    <!-- Connection status -->
    <div class="ctrl-conn-row">
      <div class="conn-dot" id="connDot"></div>
      <span class="conn-label" id="connLabel">ОФЛАЙН</span>
    </div>
  </div>
</div>

<!-- DISPLAY -->
<div id="screen-display" class="screen" style="position:relative; overflow:hidden;">
  <div style="position:absolute; top:0; left:0; right:0; height:2px; z-index:5;"><div id="dispProgress" style="height:100%; width:0%; background:var(--accent); transition:width 0.2s linear;"></div></div>
  <div class="disp-wrap" id="dispWrap">
    <div class="disp-text" id="dispText"></div>
  </div>
  <div class="disp-waiting" id="dispWaiting">ОЖИДАНИЕ СИГНАЛА...</div>
  <div id="dispConnType" style="position:absolute; top:8px; right:12px; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:2px; color:#333; z-index:10; text-transform:uppercase; pointer-events:none;">WS</div>
  <button id="flipBtn" onclick="toggleFlip()" style="position:absolute; bottom:12px; right:12px; z-index:10; background:rgba(255,255,255,0.08); border:1px solid #333; color:#555; font-size:18px; width:44px; height:44px; border-radius:0; cursor:pointer; -webkit-appearance:none; display:flex; align-items:center; justify-content:center;">🪞</button>
</div>

<!-- SELFIE (standalone: no controller, no WS) -->
<div id="screen-selfie" class="screen">
  <video class="sf-video" id="sfVideo" playsinline autoplay muted></video>
  <div class="sf-cam-msg" id="sfCamMsg">
    <div id="sfCamMsgText"></div>

<input type="file" id="fileInput" accept=".txt" style="display:none" onchange="loadFile(event)">

<script>
// Same directory as the page, so /k/<key>/ is carried into the socket URL
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://')
  + location.host + location.pathname.replace(/[^/]*$/, '');

let ws = null, role = null;
let state = { text: '', playing: false, speed: 50, position: 0, fontSize: 52, textWidth: 400, lineHeight: 1.35 };
let animFrame = null, lastTimestamp = null;
let currentPos = 0, totalHeight = 0;
let isSeeking = false;

const MIRROR_SCALE = 0.32;

// ── WebRTC config ──
const RTC_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun3.l.google.com:19302' },
    { urls: 'stun:stun4.l.google.com:19302' }
  ],
  iceCandidatePoolSize: 5
};

// Controller: map of displayId -> { pc, dc, ready }
const peers = new Map();
// Display: single peer connection from controller
let displayPC = null;
let displayDC = null;
let rtcReady = false; // true when at least one DataChannel is open

// ── SEND COMMAND (WebRTC if available, WS fallback) ──
function sendCommand(msg) {
  // Enrich messages with full state so DataChannel messages are self-contained
  // (WS messages get enriched by the server, but DC messages go direct)
  const now = Date.now();
  switch (msg.type) {
    case 'play':
      msg.position = currentPos;
      msg.speed = state.speed;
      msg.lastUpdate = now;
      break;
    case 'pause':
      msg.position = msg.position != null ? msg.position : currentPos;
      break;
    case 'seek':
      msg.position = msg.position != null ? msg.position : currentPos;
      msg.playing = state.playing;
      msg.lastUpdate = now;
      break;
    case 'speed':
      msg.position = msg.position != null ? msg.position : currentPos;
      msg.playing = state.playing;
      msg.lastUpdate = now;
      break;
  }

  const data = JSON.stringify(msg);

  if (role === 'controller') {
    // Send via DataChannel to all connected displays
    peers.forEach(peer => {
      if (peer.dc && peer.dc.readyState === 'open') {
        peer.dc.send(data);
      }
    });
    // Always send via WS too (for server state sync + fallback)
    ws?.send(data);
  } else {
    ws?.send(data);
  }
}

// ── CONNECT (WebSocket for signaling + fallback) ──
function connect() {
  if (ws) {
    try { ws.close(); } catch {}
  }
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    setConnected(true);
    const msg = { type: 'join', role };
    ws.send(JSON.stringify(msg));
  };
  ws.onclose = () => {
    setConnected(false);
    // Clean up all peer connections on WS disconnect
    if (role === 'controller') {
      peers.forEach(peer => { try { peer.pc.close(); } catch {} });
      peers.clear();
      updateRTCStatus();
    }
    if (role === 'display') {
      if (displayPC) { try { displayPC.close(); } catch {} }
      displayPC = null;
      displayDC = null;
      rtcReady = false;
    }
    setTimeout(connect, 1500);
  };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type.startsWith('rtc-') || msg.type === 'display-joined' || msg.type === 'display-left') {
      handleSignaling(msg);
      return;
    }
    // On display: only skip WS commands if DataChannel is genuinely open right now
    if (role === 'display' && displayDC && displayDC.readyState === 'open') {
      if (msg.type === 'state') {
        handleMessage(msg);
      }
      return;
    }
    handleMessage(msg);
  };
}

// ── WebRTC SIGNALING ──
function handleSignaling(msg) {
  switch (msg.type) {
    case 'display-joined':
      if (role === 'controller') createPeerConnection(msg.displayId);
      break;
    case 'display-left':
      if (role === 'controller') {
        const peer = peers.get(msg.displayId);
        if (peer?.pc) peer.pc.close();
        peers.delete(msg.displayId);
        updateRTCStatus();
      }
      break;
    case 'rtc-offer':
      if (role === 'display') handleOffer(msg);
      break;
    case 'rtc-answer':
      if (role === 'controller') handleAnswer(msg);
      break;
    case 'rtc-ice':
      handleICE(msg);
      break;
  }
}

// Controller: create peer connection to a display
async function createPeerConnection(displayId, retryCount = 0) {
  // Don't attempt if WS is not connected
  if (!ws || ws.readyState !== 1) return;

  // Clean up any existing connection to this display
  const existing = peers.get(displayId);
  if (existing) {
    try { existing.pc.close(); } catch {}
    peers.delete(displayId);
  }

  const pc = new RTCPeerConnection(RTC_CONFIG);
  const dc = pc.createDataChannel('commands', { ordered: true });
  const peer = { pc, dc, ready: false };
  peers.set(displayId, peer);

  dc.onopen = () => {
    peer.ready = true;
    updateRTCStatus();
    console.log(`[RTC] DataChannel open to display ${displayId}`);
  };
  dc.onclose = () => {
    peer.ready = false;
    updateRTCStatus();
  };

  pc.onicecandidate = e => {
    if (e.candidate && ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'rtc-ice', candidate: e.candidate, targetId: displayId }));
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') {
      peer.ready = false;
      updateRTCStatus();
      if (retryCount < 2 && peers.get(displayId) === peer) {
        setTimeout(() => createPeerConnection(displayId, retryCount + 1), 2000);
      }
    }
  };

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'rtc-offer', offer, targetId: displayId }));
    }
  } catch (err) {
    console.warn('[RTC] Failed to create offer:', err);
  }

  // Timeout: if DC doesn't open in 5s, retry (max 2 retries)
  setTimeout(() => {
    if (peer.ready) return;
    if (peers.get(displayId) !== peer) return; // already replaced
    if (retryCount < 2) {
      console.log(`[RTC] Timeout for display ${displayId}, retry ${retryCount + 1}`);
      createPeerConnection(displayId, retryCount + 1);
    }
  }, 5000);
}

// Display: handle incoming offer from controller
async function handleOffer(msg) {
  if (displayPC) displayPC.close();
  displayPC = null;
  displayDC = null;
  rtcReady = false;

  const pc = new RTCPeerConnection(RTC_CONFIG);
  displayPC = pc;

  pc.ondatachannel = e => {
    displayDC = e.channel;
    displayDC.onmessage = ev => {
      const cmd = JSON.parse(ev.data);
      handleMessage(cmd);
    };
    displayDC.onopen = () => {
      rtcReady = true;
      console.log('[RTC] DataChannel open from controller');
      updateDispConnType();
    };
    displayDC.onclose = () => {
      rtcReady = false;
      updateDispConnType();
    };
  };

  pc.onicecandidate = e => {
    if (e.candidate) {
      ws?.send(JSON.stringify({ type: 'rtc-ice', candidate: e.candidate }));
    }
  };

  try {
    await pc.setRemoteDescription(msg.offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    ws?.send(JSON.stringify({ type: 'rtc-answer', answer, fromId: msg.fromId }));
  } catch (err) {
    console.warn('[RTC] Failed to handle offer:', err);
  }
}

// Controller: handle answer from display
async function handleAnswer(msg) {
  const peer = peers.get(msg.fromId);
  if (!peer) return;
  try {
    await peer.pc.setRemoteDescription(msg.answer);
  } catch (err) {
    console.warn('[RTC] Failed to set answer:', err);
  }
}

// Both: handle ICE candidate
async function handleICE(msg) {
  try {
    if (role === 'controller') {
      const peer = peers.get(msg.fromId);
      if (peer) await peer.pc.addIceCandidate(msg.candidate);
    } else {
      if (displayPC) await displayPC.addIceCandidate(msg.candidate);
    }
  } catch (err) {
    // ICE candidates can arrive before remote description is set, safe to ignore
  }
}

function updateRTCStatus() {
  if (role !== 'controller') return;
  const total = peers.size;
  const ready = [...peers.values()].filter(p => p.ready).length;
  const anyReady = ready > 0;
  const allReady = total > 0 && ready === total;
  rtcReady = anyReady;
  const label = document.getElementById('connLabel');
  if (label) {
    if (allReady && total > 0) {
      label.textContent = `P2P ${ready}/${total}`;
      label.style.color = 'var(--green)';
    } else if (anyReady) {
      label.textContent = `P2P ${ready}/${total}`;
      label.style.color = 'var(--accent)';
    } else if (total > 0) {
      label.textContent = `WS (${total})`;
      label.style.color = '';
    } else {
      label.textContent = 'ОНЛАЙН';
      label.style.color = '';
    }
  }
}

function updateDispConnType() {
  const el = document.getElementById('dispConnType');
  if (!el) return;
  if (displayDC && displayDC.readyState === 'open') {
    el.textContent = 'P2P';
    el.style.color = '#00ff88';
  } else {
    el.textContent = 'WS';
    el.style.color = '#666';
  }
}

function setConnected(v) {
  if (role !== 'controller') return;
  document.getElementById('connDot').classList.toggle('online', v);
  if (!v) {
    document.getElementById('connLabel').textContent = 'ОФЛАЙН';
    document.getElementById('connLabel').style.color = '';
  } else if (!rtcReady) {
    document.getElementById('connLabel').textContent = 'ОНЛАЙН';
    document.getElementById('connLabel').style.color = '';
  }
}

// ── MESSAGES (from WS or DataChannel) ──
function handleMessage(msg) {
  switch (msg.type) {
    case 'state': applyState(msg); break;

    case 'play':
      state.playing = true; state.speed = msg.speed;
      currentPos = msg.position != null ? msg.position : currentPos;
      lastTimestamp = performance.now();
      applyScrollPos();
      startScroll(); updatePlayBtn(); updateDim();
      break;

    case 'pause':
      state.playing = false;
      currentPos = msg.position != null ? msg.position : currentPos;
      stopScroll(); applyScrollPos(); updatePlayBtn(); updateDim(); updateProgress();
      break;

    case 'seek':
      if (role === 'controller' && isSeeking) break;
      currentPos = msg.position;
      lastTimestamp = performance.now();
      applyScrollPos();
      if (msg.playing) startScroll();
      updateProgress();
      break;

    case 'speed':
      state.speed = msg.speed;
      currentPos = msg.position;
      lastTimestamp = performance.now();
      applyScrollPos();
      if (role === 'controller') {
        document.getElementById('speedSlider').value = msg.speed;
        document.getElementById('speedVal').textContent = msg.speed;
      }
      if (state.playing) startScroll();
      break;

    case 'fontSize':
      state.fontSize = msg.fontSize; applyFontSize(); break;

    case 'textWidth':
      state.textWidth = msg.textWidth; applyTextWidth();
      setTimeout(calcHeight, 80);
      break;

    case 'lineHeight':
      state.lineHeight = msg.lineHeight; applyLineHeight();
      setTimeout(calcHeight, 80);
      break;
  }
}

function applyState(s) {
  const hadText = !!state.text;
  state = { ...state, ...s };

  // Only apply server position if:
  // - first load (no text yet), or
  // - not currently playing (paused state is authoritative)
  if (!hadText || !s.playing) {
    currentPos = s.position;
  }

  setText(s.text);
  applyFontSize();
  setTimeout(() => { calcHeight(); applyScrollPos(); updateProgress(); }, 80);
  if (role === 'controller') {
    document.getElementById('speedSlider').value = s.speed;
    document.getElementById('speedVal').textContent = s.speed;
    document.getElementById('fontSlider').value = s.fontSize;
    document.getElementById('fontVal').textContent = s.fontSize;
    if (s.textWidth != null) {
      document.getElementById('textWidthSlider').value = s.textWidth;
      document.getElementById('textWidthVal').textContent = s.textWidth;
    }
    if (s.lineHeight != null) {
      document.getElementById('lineHeightSlider').value = Math.round(s.lineHeight * 100);
      document.getElementById('lineHeightVal').textContent = s.lineHeight.toFixed(2);
    }
  }
  applyTextWidth();
  applyLineHeight();
  updatePlayBtn(); updateDim();
  if (s.playing) { lastTimestamp = performance.now(); startScroll(); }
}

function setText(text) {
  const ctrlEl = document.getElementById('ctrlText');
  const dispEl = document.getElementById('dispText');
  if (ctrlEl) ctrlEl.textContent = text;
  if (dispEl) dispEl.textContent = text;
  const empty = document.getElementById('ctrlEmpty');
  if (empty) empty.style.display = text ? 'none' : '';
  const dw = document.getElementById('dispWaiting');
  if (dw) dw.style.display = text ? 'none' : '';
  state.text = text;
}

// ── SCROLL ──
function startScroll() {
  if (animFrame) cancelAnimationFrame(animFrame);
  lastTimestamp = lastTimestamp ?? performance.now();
  animFrame = requestAnimationFrame(scrollStep);
}
function stopScroll() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  lastTimestamp = null;
}
function scrollStep(ts) {
  if (!state.playing) { stopScroll(); return; }
  const dt = (ts - (lastTimestamp ?? ts)) / 1000;
  lastTimestamp = ts;
  currentPos += state.speed * dt;
  if (currentPos >= totalHeight) {
    currentPos = totalHeight; state.playing = false;
    stopScroll(); updatePlayBtn(); updateDim();
    if (role === 'controller') sendCommand({ type: 'pause', position: currentPos });
  }
  applyScrollPos(); updateProgress();
  animFrame = requestAnimationFrame(scrollStep);
}

function applyScrollPos() {
  // Display: normal translateY
  const dispWrap = document.getElementById('dispWrap');
  if (dispWrap) dispWrap.style.transform = `translateY(${-currentPos}px)`;

  const ctrlWrap = document.getElementById('ctrlTextWrap');
  if (ctrlWrap) {
    const s = window._mirrorScale || MIRROR_SCALE;
    ctrlWrap.style.transform = `scale(${s}) translateY(${-currentPos}px)`;
  }
}

function applyFontSize() {
  const fs = state.fontSize + 'px';
  const ctrlEl = document.getElementById('ctrlText');
  const dispEl = document.getElementById('dispText');
  if (ctrlEl) ctrlEl.style.fontSize = fs;
  if (dispEl) dispEl.style.fontSize = fs;
  setTimeout(calcHeight, 80);
}

function calcHeight() {
  if (role === 'display') {
    const w = document.getElementById('dispWrap');
    if (w) totalHeight = Math.max(0, w.scrollHeight - window.innerHeight);
  } else {
    // Controller: calculate based on display dimensions
    // The mirror wrap renders at display width, so scrollHeight is in display coords
    const w = document.getElementById('ctrlTextWrap');
    const dH = 390; // fixed landscape height
    if (w) totalHeight = Math.max(0, w.scrollHeight - dH);
  }
}

function updateProgress() {
  const pct = (totalHeight > 0 ? (currentPos / totalHeight) * 100 : 0) + '%';
  const ctrl = document.getElementById('ctrlProgress');
  if (ctrl) ctrl.style.width = pct;
  const disp = document.getElementById('dispProgress');
  if (disp) disp.style.width = pct;
}

function updatePlayBtn() {
  if (role !== 'controller') return;
  const playing = state.playing;
  document.getElementById('playIcon').textContent = playing ? '⏸' : '▶';
  document.getElementById('playLabel').textContent = playing ? 'ПАУЗА' : 'СТАРТ';
  document.getElementById('playBtn').classList.toggle('playing', playing);
}

function updateDim() {
  if (role !== 'controller') return;
  const dim = document.getElementById('ctrlDim');
  dim.classList.toggle('paused', !state.playing);
}

// ── JOIN ──
function joinAs(r) {
  role = r;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(r === 'controller' ? 'screen-controller' : 'screen-display').classList.add('active');
  if (r === 'controller') {
    // Wait for layout before computing mirror dimensions
    requestAnimationFrame(() => {
      initMirrorScale();
      setupMirrorGestures();
    });
  }
  if (r === 'display') {
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
    // Force landscape display via CSS rotation when phone is in portrait
    forceDisplayLandscape();
    window.addEventListener('resize', forceDisplayLandscape);
  }
  connect();
}

// ── MIRROR GESTURES (tap = pause/play, swipe = seek with auto-pause) ──
function setupMirrorGestures() {
  const el = document.getElementById('ctrlMirror');
  if (!el) return;

  let startY = 0, startTime = 0, moved = false;
  let wasPlaying = false;
  let lastSendTime = 0;

  el.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startTime = Date.now();
    moved = false;
    isSeeking = false;
    wasPlaying = state.playing;
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - startY;
    // First move: need threshold to distinguish tap from swipe
    if (!moved && Math.abs(dy) < 6) return;

    if (!moved) {
      moved = true;
      isSeeking = true;
      // Auto-pause on first move
      if (state.playing) {
        state.playing = false;
        stopScroll();
        updatePlayBtn(); updateDim();
        sendCommand({ type: 'pause', position: currentPos });
      }
    }

    // Apply every pixel of movement for smooth mirror scrolling
    const scale = window._mirrorScale || MIRROR_SCALE;
    const delta = -dy / scale;
    currentPos = Math.max(0, Math.min(totalHeight, currentPos + delta));
    startY = e.touches[0].clientY;
    applyScrollPos();
    updateProgress();

    // Throttle network sends to ~60fps
    const now = Date.now();
    if (now - lastSendTime > 16) {
      sendCommand({ type: 'seek', position: currentPos });
      lastSendTime = now;
    }
  }, { passive: true });

  el.addEventListener('touchend', e => {
    isSeeking = false;
    // Always send final position
    if (moved) sendCommand({ type: 'seek', position: currentPos });
    if (!moved && Date.now() - startTime < 300) {
      togglePlay();
    } else if (moved && wasPlaying) {
      // Resume playback after scroll
      state.playing = true;
      sendCommand({ type: 'play' });
      startScroll();
      updatePlayBtn(); updateDim();
    }
    wasPlaying = false;
  }, { passive: true });
}

// ── CONTROLS ──
function togglePlay() {
  if (!state.text) { openEdit(); return; }
  state.playing = !state.playing;
  if (state.playing) {
    sendCommand({ type: 'play' });
    startScroll();
  } else {
    sendCommand({ type: 'pause', position: currentPos });
    stopScroll(); applyScrollPos();
  }
  updatePlayBtn(); updateDim();
}

function onSpeed(val) {
  state.speed = +val;
  document.getElementById('speedVal').textContent = val;
  sendCommand({ type: 'speed', speed: +val, position: currentPos });
}

function onFontSize(val) {
  state.fontSize = +val;
  document.getElementById('fontVal').textContent = val;
  applyFontSize();
  sendCommand({ type: 'fontSize', fontSize: +val });
}

function onTextWidth(val) {
  state.textWidth = +val;
  document.getElementById('textWidthVal').textContent = val;
  applyTextWidth();
  sendCommand({ type: 'textWidth', textWidth: +val });
  setTimeout(calcHeight, 80);
}

function applyTextWidth() {
  const w = (state.textWidth || 400) + 'px';
  const els = [
    document.getElementById('ctrlText'),
    document.getElementById('dispText')
  ];
  els.forEach(el => {
    if (el) el.style.width = w;
  });
}

function onLineHeight(val) {
  state.lineHeight = +val / 100;
  document.getElementById('lineHeightVal').textContent = state.lineHeight.toFixed(2);
  applyLineHeight();
  sendCommand({ type: 'lineHeight', lineHeight: +val / 100 });
  setTimeout(calcHeight, 80);
}

function applyLineHeight() {
  const lh = (state.lineHeight || 1.35) + '';
  const els = [
    document.getElementById('ctrlText'),
    document.getElementById('dispText')
  ];
  els.forEach(el => {
    if (el) el.style.lineHeight = lh;
  });
}

function replayFromStart() {
  state.playing = false;
  currentPos = 0;
  stopScroll();
  applyScrollPos();
  updateProgress();
  updatePlayBtn();
  updateDim();
  sendCommand({ type: 'seek', position: 0 });
}

let flipped = false;
let rotated = false;

function forceDisplayLandscape() {
  const screen = document.getElementById('screen-display');
  if (!screen) return;
  const isPortrait = window.innerHeight > window.innerWidth;
  rotated = isPortrait;
  applyDisplayTransform();

  if (isPortrait) {
    screen.style.width = window.innerHeight + 'px';
    screen.style.height = window.innerWidth + 'px';
  } else {
    screen.style.width = '';
    screen.style.height = '';
  }

  setTimeout(calcHeight, 100);
}

function applyDisplayTransform() {
  const screen = document.getElementById('screen-display');
  if (!screen) return;
  let t = '';
  if (rotated) t += 'rotate(90deg) ';
  if (flipped) t += 'scaleX(-1) ';
  screen.style.transform = t || '';
  screen.style.transformOrigin = rotated ? 'top left' : '';
  if (rotated) {
    screen.style.position = 'absolute';
    screen.style.top = '0';
    screen.style.left = window.innerWidth + 'px';
  } else {
    screen.style.position = '';
    screen.style.top = '';
    screen.style.left = '';
  }
}

function toggleFlip() {
  flipped = !flipped;
  applyDisplayTransform();
  // Keep the button itself readable
  const btn = document.getElementById('flipBtn');
  btn.style.transform = flipped ? 'scaleX(-1)' : '';
}

function openEdit() {
  document.getElementById('scriptInput').value = state.text || '';
  document.getElementById('editModal').classList.add('active');
  setTimeout(() => document.getElementById('scriptInput').focus(), 100);
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('active');
}

function sendText() {
  const text = document.getElementById('scriptInput').value.trim();
  if (!text) return;
  if (role === 'selfie') { sfSetText(text); closeEdit(); return; }
  // Apply locally on controller
  state.position = 0;
  state.playing = false;
  currentPos = 0;
  setText(text);
  applyFontSize();
  setTimeout(() => { calcHeight(); applyScrollPos(); updateProgress(); }, 80);
  updatePlayBtn(); updateDim();
  // Send to displays
  sendCommand({ type: 'setText', text });
  closeEdit();
}

function loadFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    if (role === 'selfie') { sfSetText(ev.target.result.trim()); return; }
    document.getElementById('scriptInput').value = ev.target.result;
    document.getElementById('editModal').classList.add('active');
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

window.addEventListener('resize', () => {
  if (role === 'controller') initMirrorScale();
  calcHeight();
});

// ── KEEPALIVE & RECONNECT ──
// Ping every 15s to keep WS alive
setInterval(() => {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 15000);

// Reconnect when app comes back to foreground
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && role && role !== 'selfie') {
    // Check if WS is dead
    if (!ws || ws.readyState > 1) {
      connect();
    }
  }
});

function initMirrorScale() {
  const mirror = document.getElementById('ctrlMirror');
  const wrap = document.getElementById('ctrlTextWrap');
  if (!mirror || !wrap) return;

  // Fixed landscape dimensions (display is always forced to landscape)
  const dW = 844;
  const dH = 390;

  // Mirror can take at most 45% of the controller's screen height
  const maxMirrorH = window.innerHeight * 0.45;
  // We also want to fit display width into mirror width
  const mirrorW = mirror.offsetWidth || window.innerWidth;
  const scaleByWidth = mirrorW / dW;
  const scaleByHeight = maxMirrorH / dH;
  // Use the smaller scale so the mirror fits both constraints
  const scale = Math.min(scaleByWidth, scaleByHeight);

  // The wrap renders at actual display width so line breaks match exactly
  wrap.style.width = dW + 'px';
  wrap.style.paddingLeft = '32px';
  wrap.style.paddingRight = '32px';
  wrap.style.transformOrigin = 'top left';
  wrap.dataset.scale = scale;
  window._mirrorScale = scale;
  window._displayH = dH;

  // Mirror height = exactly one display screen, scaled
  const mirrorHeight = dH * scale;
  mirror.style.flex = 'none';
  mirror.style.height = mirrorHeight + 'px';

  // Bottom padding matches display's 100vh equivalent
  wrap.style.paddingBottom = dH + 'px';

  // If scaled content is narrower than mirror, center it
  const scaledW = dW * scale;
  if (scaledW < mirrorW) {
    wrap.style.left = ((mirrorW - scaledW) / 2) + 'px';
  } else {
    wrap.style.left = '0px';
  }

  calcHeight();
}

// ══ SELFIE ══
// Standalone mode: own camera, own scroll loop, own settings. Never connects
// to the server and never touches controller/display state.
const SF_DEFAULTS = {
  fontSize: 28, lineHeight: 1.3, offsetX: 0, textWidth: 320, speed: 35,
  bandHeight: 30, bgAlpha: 45, outline: 1.5, color: '#ffffff', reflow: true
};
const sf = {
  ...SF_DEFAULTS, text: '',
  pos: 0, playing: false, last: null, raf: null,
  stream: null, recorder: null, recStart: 0, recTimer: null, blob: null, blobDur: 0
};
const sfEl = id => document.getElementById(id);

function startSelfie() {
  role = 'selfie';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  sfEl('screen-selfie').classList.add('active');
  sfLoadSettings();
  sfBindSettings();
  sfSetText(sf.text, true);
  sfSetupScreenGestures();
  sfKeepAwake();
  sfStartCamera();
}

// ── Settings (remembered per phone: the lens offset differs between models) ──
function sfLoadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem('prompter-selfie') || '{}');
    Object.keys(SF_DEFAULTS).forEach(k => { if (saved[k] != null) sf[k] = saved[k]; });
    if (typeof saved.text === 'string') sf.text = saved.text;
  } catch {}
}
function sfSaveSettings() {
  try {
    const out = { text: sf.text };
    Object.keys(SF_DEFAULTS).forEach(k => out[k] = sf[k]);
    localStorage.setItem('prompter-selfie', JSON.stringify(out));
  } catch {}
}

function sfFormat(key, v) {
  if (key === 'offsetX') return (v > 0 ? '+' : '') + v;
  if (key === 'bandHeight' || key === 'bgAlpha') return v + '%';
  if (key === 'lineHeight') return (+v).toFixed(2);
  return v;
}

function sfBindSettings() {
  document.querySelectorAll('[data-sf]').forEach(input => {
    const key = input.dataset.sf;
    input.value = sf[key];
    input.oninput = () => {
      sf[key] = +input.value;
      sfApplyStyle();
      sfSaveSettings();
    };
  });
  document.querySelectorAll('.sf-swatch').forEach(b => {
    b.onclick = () => sfSetColor(b.dataset.color);
  });
  sfEl('sfColorInput').oninput = e => sfSetColor(e.target.value);
  sfApplyStyle();
}

function sfSetColor(c) {
  sf.color = c;
  sfApplyStyle();
  sfSaveSettings();
}

function sfOutlineShadow(r) {
  if (!r) return 'none';
  // Ring of hard shadows — works on any text, unlike -webkit-text-stroke which eats into thin glyphs
  const n = 16, out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    out.push(`${(Math.cos(a) * r).toFixed(2)}px ${(Math.sin(a) * r).toFixed(2)}px 0 #000`);
  }
  return out.join(',');
}

function sfApplyStyle() {
  const band = sfEl('sfBand'), box = sfEl('sfBox'), text = sfEl('sfText');
  // The box can't be wider than the screen — beyond that the sides just get cut off
  const maxW = window.innerWidth;
  sfEl('sfWidthSlider').max = maxW;
  if (sf.textWidth > maxW) sf.textWidth = maxW;
  band.style.height = sf.bandHeight + '%';
  box.style.width = sf.textWidth + 'px';
  box.style.transform = `translateX(${sf.offsetX}px)`;
  box.style.background = `rgba(0,0,0,${sf.bgAlpha / 100})`;
  text.style.fontSize = sf.fontSize + 'px';
  text.style.lineHeight = sf.lineHeight;
  text.style.color = sf.color;
  text.style.textShadow = sfOutlineShadow(sf.outline);
  // Let the last line scroll all the way up to the top of the band
  sfEl('sfTextWrap').style.paddingBottom = band.offsetHeight + 'px';

  document.querySelectorAll('[data-sf-val]').forEach(el => {
    el.textContent = sfFormat(el.dataset.sfVal, sf[el.dataset.sfVal]);
  });
  document.querySelectorAll('[data-sf]').forEach(input => { input.value = sf[input.dataset.sf]; });
  document.querySelectorAll('.sf-swatch').forEach(b => b.classList.toggle('on', b.dataset.color === sf.color));
  document.querySelectorAll('.sf-toggle').forEach(b => b.classList.toggle('on', (b.dataset.reflow === '1') === sf.reflow));
  sfEl('sfColorInput').value = sf.color;

  sf.pos = Math.min(sf.pos, sfMaxPos());
  sfApplyPos();
}

function sfResetSettings() {
  Object.assign(sf, SF_DEFAULTS);
  sfApplyStyle();
  sfSaveSettings();
}

function sfToggleSettings() {
  const open = sfEl('sfSettings').classList.toggle('open');
  sfEl('sfSettingsBtn').classList.toggle('on', open);
}

// ── Text & scroll ──
// «Авто»: single line breaks from the file become spaces so the text reflows to the
// band width; blank lines (paragraphs) stay. «Из файла»: lines exactly as written.
function sfDisplayText() {
  const t = sf.text.replace(/\r\n?/g, '\n');
  if (!sf.reflow) return t;
  return t.split(/\n[ \t]*\n\s*/).map(p => p.replace(/[ \t]*\n[ \t]*/g, ' ')).join('\n\n');
}

function sfSetReflow(on) {
  sf.reflow = on;
  sfEl('sfText').textContent = sfDisplayText();
  sfSaveSettings();
  sfApplyStyle();
}

function sfSetText(text, keepPos) {
  sf.text = text || '';
  sfEl('sfText').textContent = sfDisplayText();
  sfEl('sfEmpty').style.display = sf.text ? 'none' : '';
  if (!keepPos) sf.pos = 0;
  sfSetPlaying(false);
  sfSaveSettings();
  requestAnimationFrame(sfApplyStyle);
}

function sfOpenEdit() {
  sfEl('scriptInput').value = sf.text;
  document.querySelector('#editModal .edit-btn.primary').textContent = 'Готово';
  sfEl('editModal').classList.add('active');
  setTimeout(() => sfEl('scriptInput').focus(), 100);
}

function sfMaxPos() {
  const t = sfEl('sfText');
  return Math.max(0, t.offsetHeight - sf.fontSize * sf.lineHeight);
}

function sfApplyPos() {
  sfEl('sfTextWrap').style.transform = `translateY(${-sf.pos}px)`;
  const max = sfMaxPos();
  sfEl('sfProgress').style.width = (max > 0 ? sf.pos / max * 100 : 0) + '%';
}

function sfSetPlaying(p) {
  sf.playing = !!(p && sf.text);
  if (sf.raf) cancelAnimationFrame(sf.raf);
  sf.raf = null; sf.last = null;
  if (sf.playing) {
    if (sf.pos >= sfMaxPos()) sf.pos = 0; // replay from the top once finished
    sf.raf = requestAnimationFrame(sfStep);
  }
  sfEl('sfPlayBtn').textContent = sf.playing ? '⏸' : '▶';
  sfEl('sfPlayBtn').classList.toggle('on', sf.playing);
}

function sfTogglePlay() {
  if (!sf.text) { sfOpenEdit(); return; }
  sfSetPlaying(!sf.playing);
}

function sfRewind() {
  sfSetPlaying(false);
  sf.pos = 0;
  sfApplyPos();
}

function sfStep(ts) {
  if (!sf.playing) return;
  const dt = (ts - (sf.last ?? ts)) / 1000;
  sf.last = ts;
  sf.pos += sf.speed * dt;
  const max = sfMaxPos();
  if (sf.pos >= max) { sf.pos = max; sfApplyPos(); sfSetPlaying(false); return; }
  sfApplyPos();
  sf.raf = requestAnimationFrame(sfStep);
}

// Tap anywhere on the picture = play/pause, drag = scroll the text (pauses while
// dragging, resumes after). Buttons, the settings sheet and dialogs keep their own taps;
// with settings open a tap on the picture just closes them.
function sfSetupScreenGestures() {
  const screen = sfEl('screen-selfie');
  if (screen._bound) return;
  screen._bound = true;
  let startY = 0, lastY = 0, startT = 0, moved = false, wasPlaying = false, active = false;
  screen.addEventListener('pointerdown', e => {
    if (e.target.closest('.sf-bar, .sf-settings, .sf-save, button, input')) return;
    active = true; moved = false;
    startY = lastY = e.clientY; startT = Date.now();
    wasPlaying = sf.playing;
    screen.setPointerCapture(e.pointerId);
  });
  screen.addEventListener('pointermove', e => {
    if (!active) return;
    if (!moved && Math.abs(e.clientY - startY) < 6) return;
    if (!moved) { moved = true; if (sf.playing) sfSetPlaying(false); }
    sf.pos = Math.max(0, Math.min(sfMaxPos(), sf.pos - (e.clientY - lastY)));
    lastY = e.clientY;
    sfApplyPos();
  });
  const end = () => {
    if (!active) return;
    active = false;
    if (!moved && Date.now() - startT < 300) {
      if (sfEl('sfSettings').classList.contains('open')) sfToggleSettings();
      else if (sf.text) sfSetPlaying(!sf.playing);
    } else if (moved && wasPlaying) sfSetPlaying(true);
  };
  screen.addEventListener('pointerup', end);
  screen.addEventListener('pointercancel', end);
}

// ── Camera ──
async function sfStartCamera() {
  const msg = sfEl('sfCamMsg');
  const showErr = t => { sfEl('sfCamMsgText').textContent = t; msg.classList.add('show'); };
  if (!navigator.mediaDevices?.getUserMedia) {
    showErr('Камера недоступна: нужен HTTPS и современный браузер');
    return;
  }
  if (sf.stream) sf.stream.getTracks().forEach(t => t.stop());
  sf.stream = null;
  const portrait = window.innerHeight >= window.innerWidth;
  try {
    sf.stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width: { ideal: portrait ? 1080 : 1920 },
        height: { ideal: portrait ? 1920 : 1080 },
        aspectRatio: { ideal: portrait ? 9 / 16 : 16 / 9 },
        frameRate: { ideal: 30 }
      },
      // Turn off the video-call voice processing (echo cancel / noise suppression / AGC):
      // it is what makes browser-recorded voice sound flat
      audio: {
        echoCancellation: false, noiseSuppression: false, autoGainControl: false,
        channelCount: { ideal: 2 }, sampleRate: { ideal: 48000 }
      }
    });
  } catch (e) {
    showErr(e.name === 'NotAllowedError'
      ? 'Нет доступа к камере и микрофону. Разрешите их в настройках браузера.'
      : 'Не удалось включить камеру: ' + (e.message || e.name));
    return;
  }
  msg.classList.remove('show');
  const v = sfEl('sfVideo');
  v.srcObject = sf.stream;
  v.play().catch(() => {});
  v.onloadedmetadata = async () => {
    // Some devices read width/height in sensor (landscape) terms — if we got a
    // landscape frame on a portrait screen, ask again with the sides swapped
    if (portrait && v.videoWidth > v.videoHeight && !v._swapped) {
      v._swapped = true;
      try {
        await sf.stream.getVideoTracks()[0].applyConstraints({
          facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 }
        });
      } catch {}
    }
    sfShowCamInfo();
  };
  v.onresize = sfShowCamInfo;
}

function sfShowCamInfo() {
  const v = sfEl('sfVideo');
  const a = sf.stream && sf.stream.getAudioTracks()[0];
  const as = a && a.getSettings ? a.getSettings() : {};
  const audio = a ? ` · звук ${as.sampleRate ? Math.round(as.sampleRate / 1000) + 'кГц ' : ''}${as.channelCount || ''}${as.channelCount ? 'ch' : ''}${as.echoCancellation ? ' (обработка вкл)' : ''}` : ' · без звука';
  sfEl('sfInfo').textContent = `Камера ${v.videoWidth}×${v.videoHeight}${audio} · ${sfPickMime() || 'формат по умолчанию'}`;
}

function sfCameraAlive() {
  return sf.stream && sf.stream.getVideoTracks().some(t => t.readyState === 'live');
}

function sfKeepAwake() {
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
}

// iOS kills the camera when the app goes to background — bring it back on return
document.addEventListener('visibilitychange', () => {
  if (role !== 'selfie' || document.visibilityState !== 'visible') return;
  sfKeepAwake();
  if (!sfCameraAlive() && !(sf.recorder && sf.recorder.state === 'recording')) sfStartCamera();
});

// ── Recording (raw camera stream: no text overlay, not mirrored) ──
function sfPickMime() {
  if (!window.MediaRecorder) return '';
  return ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
}

function sfToggleRec() {
  if (sf.recorder && sf.recorder.state === 'recording') { sf.recorder.stop(); return; }
  if (!sfCameraAlive()) { sfStartCamera(); return; }
  if (!window.MediaRecorder) { alert('Запись видео в этом браузере не поддерживается'); return; }

  const mime = sfPickMime();
  const chunks = [];
  let rec;
  try {
    rec = new MediaRecorder(sf.stream, {
      ...(mime && { mimeType: mime }), videoBitsPerSecond: 12000000, audioBitsPerSecond: 192000
    });
  } catch (e) {
    alert('Не удалось начать запись: ' + (e.message || e.name));
    return;
  }
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    sf.blobDur = (Date.now() - sf.recStart) / 1000;
    sf.blob = new Blob(chunks, { type: rec.mimeType || mime || 'video/mp4' });
    sf.recorder = null;
    sfRecUi(false);
    if (sf.blob.size) sfShowSave();
  };
  rec.start(1000);
  sf.recorder = rec;
  sf.recStart = Date.now();
  sfRecUi(true);
}

function sfRecUi(on) {
  sfEl('sfRecBtn').classList.toggle('recording', on);
  clearInterval(sf.recTimer);
  const timer = sfEl('sfTimer');
  if (!on) { timer.textContent = ''; return; }
  const tick = () => {
    const s = Math.floor((Date.now() - sf.recStart) / 1000);
    timer.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  };
  tick();
  sf.recTimer = setInterval(tick, 500);
}

function sfShowSave() {
  const s = Math.round(sf.blobDur);
  const mb = (sf.blob.size / 1048576).toFixed(1);
  sf.saved = false;
  sfEl('sfSaveMeta').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} · ${mb} МБ`;
  sfEl('sfSave').classList.add('open');
}

async function sfSaveVideo() {
  if (!sf.blob) return;
  const ext = sf.blob.type.includes('mp4') ? 'mp4' : 'webm';
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const name = `selfie-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
  const file = new File([sf.blob], name, { type: sf.blob.type });
  // iOS: the share sheet has «Сохранить видео» → goes straight to Photos
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); sfMarkSaved(); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  sfMarkSaved();
}

function sfMarkSaved() {
  sf.saved = true;
  sfEl('sfSaveMeta').textContent += ' · сохранено ✓';
}

function sfCloseSave() {
  if (!sf.saved && !confirm('Дубль не сохранён. Удалить его?')) return;
  sf.blob = null;
  sfEl('sfSave').classList.remove('open');
}

window.addEventListener('resize', () => { if (role === 'selfie') sfApplyStyle(); });
</script>
